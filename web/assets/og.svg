<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a"/>
      <stop offset="100%" stop-color="#131316"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="80" y="80" width="80" height="80" rx="20" fill="#6366f1"/>
  <text x="120" y="135" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="white" text-anchor="middle">DT</text>

  <!-- Title -->
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="white" letter-spacing="-3">DevTools Hub</text>
  <text x="80" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="88" font-weight="800" fill="url(#text)" letter-spacing="-3">20 tools untuk developer</text>

  <!-- Subtitle -->
  <text x="80" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a1a1aa">100% client-side · CLI + Web · No tracking</text>

  <!-- Footer -->
  <text x="80" y="560" font-family="ui-monospace, monospace" font-size="20" fill="#52525b">github.com/Syqmhmmd-commits/devtools-hub</text>
</svg>
