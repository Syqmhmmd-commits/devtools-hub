<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DevTools Hub — 20 tools developer</title>
<meta name="description" content="20 tools developer ringan, jalan 100% di browser. Base64, JSON, JWT, Hash, dan lainnya.">

<!-- Prevent theme flash -->
<script>
(function() {
  try {
    var saved = JSON.parse(localStorage.getItem('dt:theme'));
    var prefersDark = !window.matchMedia('(prefers-color-scheme: light)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.documentElement.style.colorScheme = 'light';
    } else {
      document.documentElement.style.colorScheme = 'dark';
    }
  } catch (e) {}
})();
</script>

<body>

<div class="noise"></div>

<header class="header">
  <div class="container header-inner">
    <a href="#/" class="logo" aria-label="DevTools Hub - Home">
      <span class="logo-mark">DT</span>
      <span class="logo-text">DevTools</span>
    </a>
    <button class="search-trigger" id="searchTrigger" aria-label="Cari tool">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <span>Cari tool...</span>
      <kbd id="kbdShortcut">⌘K</kbd>
    </button>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" aria-label="Ganti tema" title="Ganti tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <a href="https://github.com/Syqmhmmd-commits/devtools-hub" target="_blank" rel="noopener noreferrer" class="icon-btn" aria-label="GitHub repository" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2 0 1.9 1.2 1.9 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main id="homeView" class="container">
  <section class="hero">
    <h1 class="hero-title">
      <span class="gradient-text">20 tools</span> untuk developer
    </h1>
    <p class="hero-sub">Semua di browser. Gak ada data yang dikirim ke server.</p>

    <div class="hero-search">
      <button class="hero-search-input" id="heroSearch" aria-label="Cari tool">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <span>Cari di antara 20 tools...</span>
        <kbd id="heroKbd">⌘K</kbd>
      </button>
    </div>

    <div class="chips" id="categoryChips" aria-label="Filter kategori"></div>
  </section>

  <section id="favSection" class="recent-section hidden" aria-label="Favorit">
    <div class="recent-header">
      <span class="recent-icon">⭐</span>
      <span class="recent-label">Favorit</span>
    </div>
    <div class="recent-grid" id="favGrid"></div>
  </section>

  <section id="recentSection" class="recent-section hidden" aria-label="Terakhir dipakai">
    <div class="recent-header">
      <span class="recent-icon">🕐</span>
      <span class="recent-label">Terakhir dipakai</span>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </section>

  <div id="toolsContainer"></div>
</main>

<main id="toolView" class="container tool-view hidden">
  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="#/">Home</a>
    <span>›</span>
    <span id="bcCat"></span>
    <span>›</span>
    <span id="bcName"></span>
  </nav>

  <div class="tool-header">
    <div class="tool-header-main">
      <span id="toolIcon" class="tool-header-icon"></span>
      <div>
        <h1 id="toolTitle"></h1>
        <p id="toolDesc"></p>
      </div>
    </div>
    <button class="fav-btn" id="favBtn" aria-label="Tambah ke favorit" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      <span id="favBtnText">Favorit</span>
    </button>
  </div>

  <div id="toolContent" class="tool-content"></div>

  <section class="related" id="relatedSection">
    <div class="related-label">Tool terkait</div>
    <div class="related-chips" id="relatedChips"></div>
  </section>
</main>

<div id="cmdPalette" class="cmd-overlay hidden" role="dialog" aria-modal="true" aria-label="Cari tool">
  <div class="cmd-modal" onclick="event.stopPropagation()">
    <div class="cmd-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="cmdInput" type="text" placeholder="Cari tool..." autocomplete="off" aria-label="Cari tool">
      <kbd>ESC</kbd>
    </div>
    <div id="cmdResults" class="cmd-results" role="listbox"></div>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<footer class="footer">
  <div class="container footer-inner">
    <div>DevTools Hub <span class="footer-version">v1.0</span></div>
    <div class="footer-links">
      <a href="https://github.com/Syqmhmmd-commits/devtools-hub" target="_blank" rel="noopener noreferrer">GitHub</a>
      <span>·</span>
      <span>100% client-side, no tracking</span>
    </div>
  </div>
</footer>

<script src="qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
